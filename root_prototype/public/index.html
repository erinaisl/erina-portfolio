<!-- Information about the game page.-->
<!DOCTYPE html>
<html lang="en">

<!-- Browser tab name -->
<head>
    <title>ROOT</title>
    <link rel="stylesheet" href="style.css">
</head>

<!-- browser page content-->
<body>
    <main id="landingScreen">  <!-- adjusts main contents of page -->
        <h1>ROOT</h1>
        <p>Trace the network. Find the human.</p>

        <!-- room code input box-->
        <label id="roomCodeLabel" for="roomCodeInput">Room code:</label>
        <input type="text" id="roomCodeInput" placeholder="Enter room code">
       
        
        <!-- Buttons -->
        <button id="joinGameButton">Join Game</button>
        <p id="landingMessage" role="status"></p>

        <button id="createGameButton">Create Game</button>
    </main>

    <script src="script.js"></script>
</body>

</html>
